---
# group_vars/development.yml
# OpenBao configuration for development environment

openbao_addr: "http://localhost:8200"
openbao_auth_method: "token"
openbao_tls_verify: false

# No secret rotation in development
openbao_rotate_secrets: false

# Token auth for dev (dev server root token)
openbao_token: "{{ lookup('env', 'OPENBAO_DEV_TOKEN') | default('dev-token', true) }}"

# Development secrets to retrieve
openbao_secrets:
  - path: "secret/data/dev/webapp/database"
    key: "password"
    dest_var: "dev_db_password"

  - path: "secret/data/dev/webapp/api"
    key: "key"
    dest_var: "dev_api_key"

# Relaxed connection settings for dev
openbao_timeout: 10
openbao_secrets_integration_max_retries: 2
