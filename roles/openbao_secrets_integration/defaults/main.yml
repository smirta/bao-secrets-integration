---
# Default variables for OpenBao role

# OpenBao server address (required)
openbao_secrets_integration_bao_addr: ""

# Authentication method: token, userpass, approle, kubernetes, ldap, jwt
openbao_secrets_integration_bao_auth_method: "token"

# API version
openbao_secrets_integration_bao_api_version: "v1"

# TLS verification
openbao_secrets_integration_bao_tls_verify: true

# CA certificate path (optional)
openbao_secrets_integration_ca_cert: ""

# Namespace (for OpenBao Enterprise)
openbao_secrets_integration_bao_namespace: ""

# Enable/disable secret rotation on each run
openbao_secrets_integration_bao_rotate_secrets: false

# Secrets to retrieve (list of dicts with path, key, dest_var)
openbao_secrets_integration_bao_secrets: []

# Token authentication
openbao_secrets_integration_bao_token: ""

# Userpass authentication
openbao_secrets_integration_bao_username: ""
openbao_secrets_integration_bao_password: ""

# AppRole authentication
openbao_secrets_integration_bao_role_id: ""
openbao_secrets_integration_bao_secret_id: ""

# Kubernetes authentication
openbao_secrets_integration_k8s_role: ""
openbao_secrets_integration_k8s_jwt_path: "/var/run/secrets/kubernetes.io/serviceaccount/token"

# LDAP authentication
openbao_secrets_integration_ldap_username: ""
openbao_secrets_integration_ldap_password: ""

# JWT authentication
openbao_secrets_integration_jwt_role: ""
openbao_secrets_integration_jwt_token: ""

# Python package installation
openbao_secrets_integration_install_hvac: true
openbao_secrets_integration_hvac_version: "2.1.0"

# Connection timeout
openbao_secrets_integration_timeout: 30

# Retry settings
openbao_secrets_integration_max_retries: 3
openbao_secrets_integration_retry_delay: 2
