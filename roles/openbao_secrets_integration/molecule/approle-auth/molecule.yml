---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: almalinux-approle
    image: almalinux:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: openbao-approle

  - name: openbao-server
    image: almalinux:latest
    command: bao server -dev -dev-root-token-id=root-token -dev-listen-address=0.0.0.0:8200
    env:
      VAULT_DEV_ROOT_TOKEN_ID: root-token
      VAULT_ADDR: http://0.0.0.0:8200
    networks:
      - name: openbao-approle
    pre_build_image: true

provisioner:
  name: ansible
  inventory:
    host_vars:
      almalinux-approle:
        openbao_secrets_integration_bao_addr: http://openbao-server:8200
        openbao_secrets_integration_bao_auth_method: approle
        openbao_secrets_integration_bao_role_id: test-role-id
        openbao_secrets_integration_bao_secret_id: test-secret-id
        openbao_secrets_integration_bao_tls_verify: false
        openbao_secrets_integration_bao_secrets:
          - path: secret/data/prod/api
            key: api_key
            dest_var: production_api_key

verifier:
  name: ansible

scenario:
  name: approle-auth
