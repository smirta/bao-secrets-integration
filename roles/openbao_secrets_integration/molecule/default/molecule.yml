---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: almalinux-openbao
    image: almalinux:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: openbao-test

  - name: openbao-server
    image: almalinux:latest
    published_ports:
      - "8200:8200"
    env:
      VAULT_DEV_ROOT_TOKEN_ID: test-token
      VAULT_ADDR: http://0.0.0.0:8200
    networks:
      - name: openbao-test
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
  inventory:
    host_vars:
      almalinux-openbao:
        openbao_secrets_integration_bao_addr: http://openbao-server:8200
        openbao_secrets_integration_bao_auth_method: token
        openbao_secrets_integration_bao_token: test-token
        openbao_secrets_integration_bao_tls_verify: false
        openbao_secrets_integration_bao_secrets:
          - path: secret/data/test/config
            key: password
            dest_var: test_password
          - path: secret/data/test/api
            key: token
            dest_var: api_token

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
