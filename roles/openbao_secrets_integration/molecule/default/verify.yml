---
- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    - name: Check that secrets are available as variables
      ansible.builtin.assert:
        that:
          - test_password is defined
          - test_password | length > 0
          - api_token is defined
          - api_token | length > 0
        fail_msg: "Secret variables are not properly set"
        success_msg: "All secret variables are properly set"
      when: "'openbao-server' not in inventory_hostname"

    - name: Verify secret metadata is stored
      ansible.builtin.assert:
        that:
          - openbao_secrets_integration_bao_secret_metadata is defined
          - openbao_secrets_integration_bao_secret_metadata['test_password'] is defined
          - openbao_secrets_integration_bao_secret_metadata['api_token'] is defined
        fail_msg: "Secret metadata not stored correctly"
        success_msg: "Secret metadata stored correctly"
      when: "'openbao-server' not in inventory_hostname"

    - name: Display success message
      ansible.builtin.debug:
        msg: "OpenBao role verification completed successfully!"
      when: "'openbao-server' not in inventory_hostname"
