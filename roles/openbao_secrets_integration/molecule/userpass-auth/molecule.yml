---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: almalinux-userpass
    image: almalinux:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: openbao-userpass

  - name: openbao-server
    image: almalinux:latest
    env:
      VAULT_DEV_ROOT_TOKEN_ID: root-token
      VAULT_ADDR: http://0.0.0.0:8200
    networks:
      - name: openbao-userpass
    pre_build_image: true

provisioner:
  name: ansible
  inventory:
    host_vars:
      almalinux-userpass:
        openbao_secrets_integration_bao_addr: http://openbao-server:8200
        openbao_secrets_integration_bao_auth_method: userpass
        openbao_secrets_integration_bao_username: testuser
        openbao_secrets_integration_bao_password: testpass123
        openbao_secrets_integration_bao_tls_verify: false
        openbao_secrets:
          - path: secret/data/app/config
            key: db_password
            dest_var: database_password
  env:
    ANSIBLE_ROLES_PATH: /home/runner/work/bao-secrets-integration/bao-secrets-integration/roles

verifier:
  name: ansible

scenario:
  name: userpass-auth
