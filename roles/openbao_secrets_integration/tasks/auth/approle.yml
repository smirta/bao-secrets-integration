---
# AppRole authentication

- name: Validate AppRole credentials
  ansible.builtin.assert:
    that:
      - openbao_role_id is defined
      - openbao_role_id | length > 0
      - openbao_secret_id is defined
      - openbao_secret_id | length > 0
    fail_msg: "Role ID and Secret ID must be provided for AppRole authentication"

- name: Authenticate with AppRole
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ openbao_role_id }}"
      secret_id: "{{ openbao_secret_id }}"
    headers:
      X-Vault-Namespace: "{{ openbao_namespace | default(omit) }}"
    validate_certs: "{{ openbao_tls_verify }}"
    timeout: "{{ openbao_timeout }}"
    status_code: 200
  register: approle_login
  no_log: true

- name: Set OpenBao client token from AppRole
  ansible.builtin.set_fact:
    openbao_client_token: "{{ approle_login.json.auth.client_token }}"
    cacheable: no
  no_log: true

- name: Display AppRole authentication info
  ansible.builtin.debug:
    msg: "Successfully authenticated via AppRole"
