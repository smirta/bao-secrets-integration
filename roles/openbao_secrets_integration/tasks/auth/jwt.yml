---
# JWT authentication

- name: Validate JWT auth parameters
  ansible.builtin.assert:
    that:
      - openbao_secrets_integration_jwt_role is defined
      - openbao_secrets_integration_jwt_role | length > 0
      - openbao_secrets_integration_jwt_token is defined
      - openbao_secrets_integration_jwt_token | length > 0
    fail_msg: "JWT role and token must be provided for JWT authentication"

- name: Authenticate with JWT
  ansible.builtin.uri:
    url: "{{ openbao_secrets_integration_bao_addr }}/v1/auth/jwt/login"
    method: POST
    body_format: json
    body:
      role: "{{ openbao_secrets_integration_jwt_role }}"
      jwt: "{{ openbao_secrets_integration_jwt_token }}"
    headers:
      X-Vault-Namespace: "{{ openbao_secrets_integration_bao_namespace | default(omit) }}"
    validate_certs: "{{ openbao_secrets_integration_bao_tls_verify }}"
    timeout: "{{ openbao_secrets_integration_timeout }}"
    status_code: 200
  register: openbao_secrets_integration_jwt_login
  no_log: true

- name: Set OpenBao client token from JWT
  ansible.builtin.set_fact:
    openbao_secrets_integration_bao_client_token: "{{ openbao_secrets_integration_jwt_login.json.auth.client_token }}"
    cacheable: no
  no_log: true

- name: Display JWT authentication info
  ansible.builtin.debug:
    msg: "Successfully authenticated via JWT with role {{ openbao_secrets_integration_jwt_role }}"
