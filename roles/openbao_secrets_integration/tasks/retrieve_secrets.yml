---
# Retrieve secrets from OpenBao

- name: Retrieve secrets from OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/{{ item.path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_client_token }}"
      X-Vault-Namespace: "{{ openbao_namespace | default(omit) }}"
    validate_certs: "{{ openbao_tls_verify }}"
    timeout: "{{ openbao_timeout }}"
    status_code: 200
  register: secret_data
  loop: "{{ openbao_secrets }}"
  no_log: true
  retries: "{{ openbao_max_retries }}"
  delay: "{{ openbao_retry_delay }}"
  until: secret_data is succeeded

- name: Set secret variables
  ansible.builtin.set_fact:
    "{{ item.item.dest_var }}": "{{ item.json.data.data[item.item.key] }}"
  loop: "{{ secret_data.results }}"
  loop_control:
    label: "{{ item.item.dest_var }}"
  no_log: true
  when:
    - item.json.data is defined
    - item.json.data.data is defined
    - item.json.data.data[item.item.key] is defined

- name: Store secret metadata
  ansible.builtin.set_fact:
    openbao_secret_metadata: >-
      {{ openbao_secret_metadata | default({}) | combine({item.item.dest_var: {'path':
      item.item.path, 'version': item.json.data.metadata.version | default('N/A'), 'created_time':
      item.json.data.metadata.created_time | default('N/A')}}) }}
  loop: "{{ secret_data.results }}"
  loop_control:
    label: "{{ item.item.dest_var }}"
  when:
    - item.json.data is defined
    - item.json.data.metadata is defined

- name: Display retrieved secrets info
  ansible.builtin.debug:
    msg: "Retrieved {{ openbao_secrets | length }} secret(s) successfully"
