---
# Rotate secrets in OpenBao

- name: Check if secrets support rotation
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/{{ item.path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_client_token }}"
      X-Vault-Namespace: "{{ openbao_namespace | default(omit) }}"
    validate_certs: "{{ openbao_tls_verify }}"
    timeout: "{{ openbao_timeout }}"
    status_code: 200
  register: rotation_check
  loop: "{{ openbao_secrets }}"
  no_log: true
  failed_when: false

- name: Rotate secrets (for database secrets engine)
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/{{ item.path | regex_replace('/creds/', '/rotate-role/') }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_client_token }}"
      X-Vault-Namespace: "{{ openbao_namespace | default(omit) }}"
    validate_certs: "{{ openbao_tls_verify }}"
    timeout: "{{ openbao_timeout }}"
    status_code: [200, 204]
  loop: "{{ openbao_secrets }}"
  when: 
    - "'database' in item.path or 'db' in item.path"
  no_log: true
  failed_when: false
  register: rotation_result

- name: Re-retrieve secrets after rotation
  ansible.builtin.include_tasks: retrieve_secrets.yml
  when: rotation_result is changed

- name: Display rotation info
  ansible.builtin.debug:
    msg: "Secret rotation completed for enabled secrets"
