---
# Rotate secrets in OpenBao

- name: Check if secrets support rotation
  ansible.builtin.uri:
    url: "{{ openbao_secrets_integration_bao_addr }}/v1/{{ item.path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_secrets_integration_bao_token }}"
      X-Vault-Namespace: "{{ openbao_secrets_integration_bao_namespace | default(omit) }}"
    validate_certs: "{{ openbao_secrets_integration_bao_tls_verify }}"
    timeout: "{{ openbao_secrets_integration_timeout }}"
    status_code: 200
  register: openbao_secrets_integration_bao_secrets_rotation_check
  loop: "{{ openbao_secrets_integration_bao_secrets }}"
  no_log: true
  failed_when: false

- name: Rotate secrets (for database secrets engine)
  ansible.builtin.uri:
    url: "{{ openbao_secrets_integration_bao_addr }}/v1/{{ item.path | regex_replace('/creds/', '/rotate-role/') }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_secrets_integration_bao_token }}"
      X-Vault-Namespace: "{{ openbao_secrets_integration_bao_namespace | default(omit) }}"
    validate_certs: "{{ openbao_secrets_integration_bao_tls_verify }}"
    timeout: "{{ openbao_secrets_integration_timeout }}"
    status_code: [200, 204]
  loop: "{{ openbao_secrets_integration_bao_secrets }}"
  when:
    - "'database' in item.path or 'db' in item.path"
  no_log: true
  failed_when: false
  register: openbao_secrets_integration_bao_secrets_rotation_result

- name: Re-retrieve secrets after rotation
  ansible.builtin.include_tasks: retrieve_secrets.yml
  when: openbao_secrets_integration_bao_secrets_rotation_result is changed

- name: Display rotation info
  ansible.builtin.debug:
    msg: "Secret rotation completed for enabled secrets"
