---
# Integration test playbook
# Tests the OpenBao Secrets Integration Ansible Role in various scenarios

- name: Test OpenBao Secrets Integration Role - Token Authentication
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    openbao_addr: "http://localhost:8200"
    openbao_auth_method: "token"
    openbao_token: "test-root-token"
    openbao_tls_verify: false
    openbao_secrets:
      - path: "secret/data/test/app"
        key: "password"
        dest_var: "test_app_password"

  pre_tasks:
    - name: Check if OpenBao is running
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/sys/health"
        method: GET
        validate_certs: false
        status_code: [200, 429, 473, 501, 503]
      register: openbao_health
      failed_when: false

    - name: Skip if OpenBao not available
      ansible.builtin.meta: end_play
      when: openbao_health.status == -1

    - name: Create test secret
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/secret/data/test/app"
        method: POST
        body_format: json
        body:
          data:
            password: "test-password-123"
        headers:
          X-Vault-Token: "{{ openbao_token }}"
        validate_certs: false
        status_code: [200, 204]

  roles:
    - role: openbao

  post_tasks:
    - name: Verify secret retrieval
      ansible.builtin.assert:
        that:
          - test_app_password is defined
          - test_app_password == "test-password-123"
        success_msg: "Token authentication test PASSED"
        fail_msg: "Token authentication test FAILED"

- name: Test Secret Rotation
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    openbao_addr: "http://localhost:8200"
    openbao_auth_method: "token"
    openbao_token: "test-root-token"
    openbao_tls_verify: false
    openbao_rotate_secrets: true
    openbao_secrets:
      - path: "secret/data/test/rotation"
        key: "value"
        dest_var: "rotated_value"

  pre_tasks:
    - name: Create rotation test secret
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/secret/data/test/rotation"
        method: POST
        body_format: json
        body:
          data:
            value: "rotation-test-v1"
        headers:
          X-Vault-Token: "{{ openbao_token }}"
        validate_certs: false
        status_code: [200, 204]
      failed_when: false

  roles:
    - role: openbao

  post_tasks:
    - name: Verify rotation test
      ansible.builtin.assert:
        that:
          - rotated_value is defined
        success_msg: "Secret rotation test PASSED"
        fail_msg: "Secret rotation test FAILED"

- name: Test Multiple Secrets Retrieval
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    openbao_addr: "http://localhost:8200"
    openbao_auth_method: "token"
    openbao_token: "test-root-token"
    openbao_tls_verify: false
    openbao_secrets:
      - path: "secret/data/test/multi1"
        key: "key1"
        dest_var: "multi_secret_1"
      - path: "secret/data/test/multi2"
        key: "key2"
        dest_var: "multi_secret_2"
      - path: "secret/data/test/multi3"
        key: "key3"
        dest_var: "multi_secret_3"

  pre_tasks:
    - name: Create multiple test secrets
      ansible.builtin.uri:
        url: "{{ openbao_addr }}/v1/{{ item.path }}"
        method: POST
        body_format: json
        body:
          data: "{{ item.data }}"
        headers:
          X-Vault-Token: "{{ openbao_token }}"
        validate_certs: false
        status_code: [200, 204]
      loop:
        - path: "secret/data/test/multi1"
          data: {key1: "value1"}
        - path: "secret/data/test/multi2"
          data: {key2: "value2"}
        - path: "secret/data/test/multi3"
          data: {key3: "value3"}
      failed_when: false

  roles:
    - role: openbao

  post_tasks:
    - name: Verify multiple secrets
      ansible.builtin.assert:
        that:
          - multi_secret_1 is defined
          - multi_secret_2 is defined
          - multi_secret_3 is defined
          - multi_secret_1 == "value1"
          - multi_secret_2 == "value2"
          - multi_secret_3 == "value3"
        success_msg: "Multiple secrets test PASSED"
        fail_msg: "Multiple secrets test FAILED"

    - name: Display test summary
      ansible.builtin.debug:
        msg: "All integration tests completed successfully!"
